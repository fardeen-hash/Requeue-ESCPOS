buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://packagecloud.io/anastaciocintra/public/maven2"
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
